name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint action.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml

      - name: Validate action.yml and embedded scripts
        run: ./scripts/lint-action.sh

      # Pinned to an exact version so CI stays reproducible and a moving tag
      # cannot change what runs here.
      - name: Lint workflows with actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
