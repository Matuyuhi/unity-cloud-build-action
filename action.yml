name: 'Unity Cloud Build Trigger'
description: 'Trigger a Unity Cloud Build for a given branch and return the build ID.'
author: 'matuyuhi'
branding:
  icon: 'upload-cloud'
  color: 'green'
inputs:
  unity_org_id:
    description: 'Your Unity Organization ID'
    required: true
  unity_project_id:
    description: 'Your Unity Project ID'
    required: true
  build_target_id:
    description: 'Your Build Target ID'
    required: true
  unity_service_account_key_id:
    description: >-
      Key ID of a Unity service account with a Build Automation role. Combined
      with `unity_service_account_secret_key` into the HTTP Basic credential
      required by API v2. Required unless `authorization_header` is supplied.
    required: false
    default: ''
  unity_service_account_secret_key:
    description: >-
      Secret key of the Unity service account. Pass this as a secret; it is
      masked in the logs.
    required: false
    default: ''
  authorization_header:
    description: >-
      Pre-built Authorization header, e.g. "Authorization: Basic <token>". A
      bare token is also accepted and gets the "Authorization: " prefix added
      automatically. Use this only if you cannot pass the service account key
      and secret separately; it is mutually exclusive with them. Note that API
      v2 rejects the legacy Build Automation API key — the token must be
      base64("<keyId>:<secretKey>") of a service account.
    required: false
    default: ''
  branch:
    description: >-
      Git branch to build. When empty, the branch configured on the build target
      is used.
    required: false
    default: ''
  clean:
    description: 'Whether to perform a clean build (true/false)'
    required: false
    default: 'false'
  platform:
    description: >-
      Build platform override (e.g. standalonewindows64). Sent to the API only
      when set; otherwise the build target default applies.
    required: false
    default: ''
  machine_type_label:
    description: >-
      Machine type label for the build machine (e.g. win_premium_v1). Sent to
      the API as machineTypeLabel only when set; otherwise the build target
      default applies.
    required: false
    default: ''
  api_url:
    description: >-
      Base URL of the Unity Build Automation API, including the version segment.
      Defaults to API v2. The v1 base URL
      (https://build-api.cloud.unity3d.com/api/v1) still works until Unity
      removes it on 2026-12-21, but the action warns when it is used.
    required: false
    default: 'https://build-automation.services.api.unity.com/v2'
outputs:
  build_id:
    description: 'The ID (build number) of the triggered build.'
    value: '${{ steps.trigger-build.outputs.build_id }}'
  platform:
    description: 'The platform of the build, as reported by the API.'
    value: '${{ steps.trigger-build.outputs.platform }}'
  build_status:
    description: >-
      The status the build was created with, as reported by the API (e.g.
      queued). Empty if the API did not report one.
    value: '${{ steps.trigger-build.outputs.build_status }}'
runs:
  using: 'composite'
  steps:
    - name: Ensure `curl` and `jq` are available
      shell: bash
      run: |
        set -euo pipefail

        missing=()
        for cmd in curl jq; do
          command -v "$cmd" >/dev/null 2>&1 || missing+=("$cmd")
        done

        if [ ${#missing[@]} -eq 0 ]; then
          exit 0
        fi

        echo "Installing missing dependencies: ${missing[*]}"

        # apt-get needs root; brew must not run as root. Work out up front whether
        # we can elevate, so a non-root runner without sudo gets a clear message
        # instead of a bare permission error from apt-get.
        SUDO=''
        CAN_ELEVATE=1
        if [ "$(id -u)" -ne 0 ]; then
          if command -v sudo >/dev/null 2>&1; then
            SUDO='sudo'
          else
            CAN_ELEVATE=0
          fi
        fi

        if command -v apt-get >/dev/null 2>&1 && [ "$CAN_ELEVATE" -eq 1 ]; then
          $SUDO apt-get update
          $SUDO apt-get install -y "${missing[@]}"
        elif command -v brew >/dev/null 2>&1; then
          brew install "${missing[@]}"
        else
          if command -v apt-get >/dev/null 2>&1 && [ "$CAN_ELEVATE" -eq 0 ]; then
            reason='apt-get is available but this runner is neither root nor has sudo'
          else
            reason='no supported package manager (apt-get or brew) was found'
          fi
          echo "::error ::Missing required commands (${missing[*]}) and ${reason}. Please pre-install them on this runner."
          exit 1
        fi

    - name: Trigger Unity Cloud Build
      id: trigger-build
      shell: bash
      # Inputs are passed through the environment rather than interpolated into
      # the script, so that values containing shell metacharacters cannot be
      # executed as code.
      env:
        INPUT_AUTHORIZATION_HEADER: ${{ inputs.authorization_header }}
        INPUT_KEY_ID: ${{ inputs.unity_service_account_key_id }}
        INPUT_SECRET_KEY: ${{ inputs.unity_service_account_secret_key }}
        INPUT_UNITY_ORG_ID: ${{ inputs.unity_org_id }}
        INPUT_UNITY_PROJECT_ID: ${{ inputs.unity_project_id }}
        INPUT_BUILD_TARGET_ID: ${{ inputs.build_target_id }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_CLEAN: ${{ inputs.clean }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_MACHINE_TYPE_LABEL: ${{ inputs.machine_type_label }}
        INPUT_API_URL: ${{ inputs.api_url }}
      run: |
        set -euo pipefail

        # Strip CR/LF (common when secrets are pasted) and surrounding spaces.
        trim() {
          printf '%s' "${1:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
        }

        RAW_AUTH_HEADER="$(trim "${INPUT_AUTHORIZATION_HEADER:-}")"
        KEY_ID="$(trim "${INPUT_KEY_ID:-}")"
        SECRET_KEY="$(trim "${INPUT_SECRET_KEY:-}")"
        ORG_ID="$(trim "${INPUT_UNITY_ORG_ID:-}")"
        PROJ_ID="$(trim "${INPUT_UNITY_PROJECT_ID:-}")"
        TARGET_ID="$(trim "${INPUT_BUILD_TARGET_ID:-}")"
        BRANCH="$(trim "${INPUT_BRANCH:-}")"
        PLATFORM_IN="$(trim "${INPUT_PLATFORM:-}")"
        MACHINE_TYPE_LABEL="$(trim "${INPUT_MACHINE_TYPE_LABEL:-}")"
        API_URL="$(trim "${INPUT_API_URL:-}")"
        API_URL="${API_URL%/}"

        # Keep credentials out of the logs even if they were not passed as secrets.
        for secret in "$RAW_AUTH_HEADER" "$SECRET_KEY"; do
          if [ -n "$secret" ]; then
            echo "::add-mask::${secret}"
          fi
        done

        # Fail fast on missing required inputs instead of sending a doomed request.
        for pair in \
          "unity_org_id:${ORG_ID}" \
          "unity_project_id:${PROJ_ID}" \
          "build_target_id:${TARGET_ID}" \
          "api_url:${API_URL}"
        do
          name="${pair%%:*}"
          value="${pair#*:}"
          if [ -z "$value" ]; then
            echo "::error ::Input '${name}' is required but was empty."
            exit 1
          fi
        done

        # API v2 authenticates with HTTP Basic using a service account key ID and
        # secret. `authorization_header` remains supported for callers that can
        # only supply a pre-built header, but the two are mutually exclusive so a
        # half-finished migration fails loudly instead of using stale credentials.
        if [ -n "$KEY_ID" ] || [ -n "$SECRET_KEY" ]; then
          if [ -n "$RAW_AUTH_HEADER" ]; then
            echo "::error ::Provide either 'unity_service_account_key_id'/'unity_service_account_secret_key' or 'authorization_header', not both."
            exit 1
          fi
          if [ -z "$KEY_ID" ] || [ -z "$SECRET_KEY" ]; then
            echo "::error ::'unity_service_account_key_id' and 'unity_service_account_secret_key' must be set together."
            exit 1
          fi
          # `base64` wraps long lines on GNU coreutils, so strip the newlines.
          BASIC_CREDENTIAL="$(printf '%s:%s' "$KEY_ID" "$SECRET_KEY" | base64 | tr -d '\r\n')"
          echo "::add-mask::${BASIC_CREDENTIAL}"
          AUTH_HEADER="Authorization: Basic ${BASIC_CREDENTIAL}"
        elif [ -n "$RAW_AUTH_HEADER" ]; then
          AUTH_HEADER="$RAW_AUTH_HEADER"
          # Accept a bare credential as well as a full header line.
          case "$AUTH_HEADER" in
            *:*) ;;
            *)
              echo "::warning ::'authorization_header' has no header name; assuming 'Authorization: <value>'."
              AUTH_HEADER="Authorization: ${AUTH_HEADER}"
              ;;
          esac
        else
          echo "::error ::No credentials supplied. Set 'unity_service_account_key_id' and 'unity_service_account_secret_key' (recommended), or 'authorization_header'."
          exit 1
        fi
        echo "::add-mask::${AUTH_HEADER}"

        # Unity removes API v1 on 2026-12-21; warn rather than fail so existing
        # workflows keep running until then.
        case "$API_URL" in
          *build-api.cloud.unity3d.com*)
            echo "::warning ::'api_url' points at Unity Build Automation API v1, which Unity removes on 2026-12-21. Drop the 'api_url' override to use v2 (https://build-automation.services.api.unity.com/v2) and switch to service account credentials."
            ;;
        esac

        case "$(printf '%s' "$INPUT_CLEAN" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
          true|1|yes)   CLEAN_FLAG=true ;;
          ''|false|0|no) CLEAN_FLAG=false ;;
          *)
            echo "::error ::Input 'clean' must be true or false (got '${INPUT_CLEAN}')."
            exit 1
            ;;
        esac

        # Optional fields are omitted entirely so the build target defaults apply.
        PAYLOAD="$(jq -n -c \
          --argjson clean "$CLEAN_FLAG" \
          --arg branch "$BRANCH" \
          --arg platform "$PLATFORM_IN" \
          --arg machineTypeLabel "$MACHINE_TYPE_LABEL" \
          '{ clean: $clean, delay: 0 }
           + (if $branch == "" then {} else { branch: $branch } end)
           + (if $platform == "" then {} else { platform: $platform } end)
           + (if $machineTypeLabel == "" then {} else { machineTypeLabel: $machineTypeLabel } end)')"

        URL="${API_URL}/orgs/${ORG_ID}/projects/${PROJ_ID}/buildtargets/${TARGET_ID}/builds"

        # Write the response outside the workspace so the caller's checkout stays clean.
        RESPONSE_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/unity-cloud-build-response.XXXXXX")"
        trap 'rm -f "$RESPONSE_FILE"' EXIT

        echo "Triggering build: target=${TARGET_ID} branch=${BRANCH:-<build target default>} clean=${CLEAN_FLAG}"

        # Triggering a build is NOT idempotent, so never retry a request that the
        # server may already have acted on. Only DNS (6) and connect (7) failures
        # are retried: in both cases nothing reached Unity.
        HTTP_CODE=''
        CURL_RC=0
        for attempt in 1 2 3; do
          set +e
          HTTP_CODE="$(curl -sS -w '%{http_code}' -o "$RESPONSE_FILE" \
            -X POST \
            -H "$AUTH_HEADER" \
            -H 'Content-Type: application/json' \
            --connect-timeout 15 \
            --max-time 120 \
            --data "$PAYLOAD" \
            "$URL")"
          CURL_RC=$?
          set -e

          if [ "$CURL_RC" -eq 0 ]; then
            break
          fi
          if [ "$CURL_RC" -ne 6 ] && [ "$CURL_RC" -ne 7 ]; then
            break
          fi
          if [ "$attempt" -lt 3 ]; then
            echo "::warning ::Could not connect to the Unity Build Automation API (curl exit ${CURL_RC}); retrying (attempt ${attempt}/3)."
            sleep $((attempt * 2))
          fi
        done

        if [ "$CURL_RC" -ne 0 ]; then
          echo "::error ::Request to the Unity Build Automation API failed (curl exit ${CURL_RC}). No build was triggered."
          exit 1
        fi

        if [ "${RUNNER_DEBUG:-}" = '1' ]; then
          echo "::debug ::HTTP ${HTTP_CODE} $(tr -d '\r\n' < "$RESPONSE_FILE")"
        fi

        # A successful trigger returns a single-element array (HTTP 202 on v2);
        # tolerate a bare object too. Errors are bare objects on both versions.
        FIRST_ENTRY='if type == "array" then (.[0] // {}) else . end'

        if [[ ! "$HTTP_CODE" =~ ^2 ]]; then
          # v2 reports errors in the RFC 7807 shape (detail/title/requestId); v1
          # used error/message. Read whichever the response carries.
          ERROR_MSG="$(jq -r "${FIRST_ENTRY} | (.detail // .error // .message // .title // empty)" "$RESPONSE_FILE" 2>/dev/null || true)"
          REQUEST_ID="$(jq -r "${FIRST_ENTRY} | (.requestId // empty)" "$RESPONSE_FILE" 2>/dev/null || true)"
          if [ -z "$ERROR_MSG" ]; then
            # Not JSON (or no message field) — fall back to a truncated raw body.
            ERROR_MSG="$(head -c 500 "$RESPONSE_FILE" | tr -d '\r\n')"
          fi
          if [ -n "$REQUEST_ID" ]; then
            # Unity support asks for this when investigating a failed request.
            ERROR_MSG="${ERROR_MSG} (requestId: ${REQUEST_ID})"
          fi
          if [ "$HTTP_CODE" = '401' ] || [ "$HTTP_CODE" = '403' ]; then
            echo "::error ::Failed to trigger build: HTTP ${HTTP_CODE} – ${ERROR_MSG:-<empty response>}. API v2 requires a Unity service account key and secret with a Build Automation role; the legacy Build Automation API key is not accepted."
          else
            echo "::error ::Failed to trigger build: HTTP ${HTTP_CODE} – ${ERROR_MSG:-<empty response>}"
          fi
          exit 1
        fi

        BUILD_ID="$(jq -r "${FIRST_ENTRY} | (.build // empty)" "$RESPONSE_FILE" 2>/dev/null || true)"
        PLATFORM_OUT="$(jq -r "${FIRST_ENTRY} | (.platform // empty)" "$RESPONSE_FILE" 2>/dev/null || true)"
        BUILD_STATUS="$(jq -r "${FIRST_ENTRY} | (.buildStatus // empty)" "$RESPONSE_FILE" 2>/dev/null || true)"

        if [ -z "$BUILD_ID" ]; then
          # A 2xx can still carry a per-target 'error' — e.g. a build for this
          # target is already running — in which case no build was started.
          ENTRY_ERROR="$(jq -r "${FIRST_ENTRY} | (.error // empty)" "$RESPONSE_FILE" 2>/dev/null || true)"
          if [ -n "$ENTRY_ERROR" ]; then
            echo "::error ::Unity Build Automation did not start a build: ${ENTRY_ERROR}"
          else
            echo "::error ::Unity Build Automation returned HTTP ${HTTP_CODE} but no build ID: $(head -c 500 "$RESPONSE_FILE" | tr -d '\r\n')"
          fi
          exit 1
        fi

        {
          echo "build_id=${BUILD_ID}"
          echo "platform=${PLATFORM_OUT}"
          echo "build_status=${BUILD_STATUS}"
        } >> "$GITHUB_OUTPUT"

        {
          echo "### Unity Build Automation build triggered"
          echo ""
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Build ID | \`${BUILD_ID}\` |"
          echo "| Build target | \`${TARGET_ID}\` |"
          echo "| Branch | \`${BRANCH:-<build target default>}\` |"
          echo "| Platform | \`${PLATFORM_OUT:-unknown}\` |"
          echo "| Status | \`${BUILD_STATUS:-unknown}\` |"
          echo "| Clean | \`${CLEAN_FLAG}\` |"
        } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

        echo "::notice ::Build triggered successfully. ID=${BUILD_ID}"
