name: 'Unity Cloud Build Trigger'
description: 'Trigger a Unity Cloud Build for a given branch and return the build ID.'
author: 'matuyuhi'
branding:
  icon: 'upload-cloud'
  color: 'green'
inputs:
  unity_org_id:
    description: 'Your Unity Organization ID'
    required: true
  unity_project_id:
    description: 'Your Unity Project ID'
    required: true
  build_target_id:
    description: >-
      Your Build Target ID. Use `_all` to build every build target in the
      project. Mutually exclusive with `build_target_group_id`; exactly one of
      the two is required.
    required: false
    default: ''
  build_target_group_id:
    description: >-
      ID (or name) of a build target group. Every enabled build target in the
      group is built, and the builds are tied together by a shared group build
      ID, the same way the dashboard does it. Mutually exclusive with
      `build_target_id`.
    required: false
    default: ''
  unity_service_account_key_id:
    description: >-
      Key ID of a Unity service account with a Build Automation role. Combined
      with `unity_service_account_secret_key` into the HTTP Basic credential
      required by API v2. The legacy Build Automation API key is not accepted.
    required: true
  unity_service_account_secret_key:
    description: >-
      Secret key of the Unity service account. Pass this as a secret; it is
      masked in the logs.
    required: true
  branch:
    description: >-
      Git branch to build. When empty, the branch configured on the build target
      is used.
    required: false
    default: ''
  clean:
    description: 'Whether to perform a clean build (true/false)'
    required: false
    default: 'false'
  platform:
    description: >-
      Build platform override (e.g. standalonewindows64). Sent to the API only
      when set; otherwise the build target default applies.
    required: false
    default: ''
  machine_type_label:
    description: >-
      Machine type label for the build machine (e.g. win_premium_v1). Sent to
      the API as machineTypeLabel only when set; otherwise the build target
      default applies.
    required: false
    default: ''
  wait_for_completion:
    description: >-
      Poll the build until it reaches a terminal state, and fail the step unless
      it succeeded. Off by default, in which case the action returns as soon as
      the build is queued — so a build Unity later cancels (for example because
      it waited too long behind another build) leaves the workflow green.
    required: false
    default: 'false'
  poll_interval_seconds:
    description: >-
      How often to poll the build status while waiting. Values below 5 are
      raised to 5 so the API is not hammered. Ignored unless
      `wait_for_completion` is enabled.
    required: false
    default: '30'
  timeout_minutes:
    description: >-
      Stop waiting after this many minutes and fail the step; the Unity build
      itself keeps running. `0` waits indefinitely (the job timeout still
      applies). Ignored unless `wait_for_completion` is enabled.
    required: false
    default: '90'
  api_url:
    description: >-
      Base URL of the Unity Build Automation API, including the version segment.
      This action speaks API v2 only; the v1 base URL is rejected.
    required: false
    default: 'https://build-automation.services.api.unity.com/v2'
outputs:
  build_id:
    description: >-
      The ID (build number) of the triggered build. Empty when more than one
      build was triggered — use `builds` instead.
    value: '${{ steps.trigger-build.outputs.build_id }}'
  platform:
    description: >-
      The platform of the build, as reported by the API. Empty when more than
      one build was triggered.
    value: '${{ steps.trigger-build.outputs.platform }}'
  build_status:
    description: >-
      The status the build was created with, as reported by the API (e.g.
      queued). Empty if the API did not report one, or when more than one build
      was triggered.
    value: '${{ steps.trigger-build.outputs.build_status }}'
  queued_reason:
    description: >-
      Why the build is waiting, as reported by the API (e.g. targetConcurrency,
      waitingForBuildAgent). Empty if the API did not report one, or when more
      than one build was triggered.
    value: '${{ steps.trigger-build.outputs.queued_reason }}'
  builds:
    description: >-
      Every triggered build as a compact JSON array of
      `{buildTargetId, build, platform, buildStatus, queuedReason}` objects, in
      the order the builds were started. Always set, including for a single
      build.
    value: '${{ steps.trigger-build.outputs.builds }}'
  build_count:
    description: 'How many builds were triggered.'
    value: '${{ steps.trigger-build.outputs.build_count }}'
  group_build_id:
    description: >-
      The group build ID shared by every build of a build target group — the
      same ID the dashboard links the builds under. Only set when
      `build_target_group_id` is used.
    value: '${{ steps.trigger-build.outputs.group_build_id }}'
  build_target_group_id:
    description: >-
      The resolved ID of the build target group that was built. Only set when
      `build_target_group_id` is used; useful when it was given as a name.
    value: '${{ steps.trigger-build.outputs.build_target_group_id }}'
  final_build_status:
    description: >-
      The terminal status of the build (success, failure, canceled, unknown).
      With several builds it is `success` only when every build succeeded, and
      otherwise the status of the first build that did not. Only set when
      `wait_for_completion` is enabled and the builds finished before the
      timeout.
    value: '${{ steps.trigger-build.outputs.final_build_status }}'
  canceled_by:
    description: >-
      Who or what canceled the build (e.g. concurrency-timelimit,
      billing-invalidsubscription, api). Only set when the build was canceled
      while `wait_for_completion` was enabled; with several builds it refers to
      the same build as `final_build_status`.
    value: '${{ steps.trigger-build.outputs.canceled_by }}'
  final_builds:
    description: >-
      The terminal state of every build as a compact JSON array of
      `{buildTargetId, build, finalStatus, canceledBy}` objects. Only set when
      `wait_for_completion` is enabled and the builds finished before the
      timeout.
    value: '${{ steps.trigger-build.outputs.final_builds }}'
runs:
  using: 'composite'
  steps:
    - name: Ensure `curl` and `jq` are available
      shell: bash
      run: |
        set -euo pipefail

        missing=()
        for cmd in curl jq; do
          command -v "$cmd" >/dev/null 2>&1 || missing+=("$cmd")
        done

        if [ ${#missing[@]} -eq 0 ]; then
          exit 0
        fi

        echo "Installing missing dependencies: ${missing[*]}"

        # apt-get needs root; brew must not run as root. Work out up front whether
        # we can elevate, so a non-root runner without sudo gets a clear message
        # instead of a bare permission error from apt-get.
        SUDO=''
        CAN_ELEVATE=1
        if [ "$(id -u)" -ne 0 ]; then
          if command -v sudo >/dev/null 2>&1; then
            SUDO='sudo'
          else
            CAN_ELEVATE=0
          fi
        fi

        if command -v apt-get >/dev/null 2>&1 && [ "$CAN_ELEVATE" -eq 1 ]; then
          $SUDO apt-get update
          $SUDO apt-get install -y "${missing[@]}"
        elif command -v brew >/dev/null 2>&1; then
          brew install "${missing[@]}"
        else
          if command -v apt-get >/dev/null 2>&1 && [ "$CAN_ELEVATE" -eq 0 ]; then
            reason='apt-get is available but this runner is neither root nor has sudo'
          else
            reason='no supported package manager (apt-get or brew) was found'
          fi
          echo "::error ::Missing required commands (${missing[*]}) and ${reason}. Please pre-install them on this runner."
          exit 1
        fi

    - name: Trigger Unity Cloud Build
      id: trigger-build
      shell: bash
      # Inputs are passed through the environment rather than interpolated into
      # the script, so that values containing shell metacharacters cannot be
      # executed as code.
      env:
        INPUT_KEY_ID: ${{ inputs.unity_service_account_key_id }}
        INPUT_SECRET_KEY: ${{ inputs.unity_service_account_secret_key }}
        INPUT_UNITY_ORG_ID: ${{ inputs.unity_org_id }}
        INPUT_UNITY_PROJECT_ID: ${{ inputs.unity_project_id }}
        INPUT_BUILD_TARGET_ID: ${{ inputs.build_target_id }}
        INPUT_BUILD_TARGET_GROUP_ID: ${{ inputs.build_target_group_id }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_CLEAN: ${{ inputs.clean }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_MACHINE_TYPE_LABEL: ${{ inputs.machine_type_label }}
        INPUT_WAIT_FOR_COMPLETION: ${{ inputs.wait_for_completion }}
        INPUT_POLL_INTERVAL_SECONDS: ${{ inputs.poll_interval_seconds }}
        INPUT_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        INPUT_API_URL: ${{ inputs.api_url }}
      run: |
        set -euo pipefail

        # Strip CR/LF (common when secrets are pasted) and surrounding spaces.
        trim() {
          printf '%s' "${1:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
        }

        # These set a global rather than echoing, because a `$(…)` subshell
        # cannot fail the step: its `exit` would only leave the subshell.
        PARSED_BOOL=''
        parse_bool() {
          case "$(printf '%s' "${2:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
            true|1|yes)    PARSED_BOOL=true ;;
            ''|false|0|no) PARSED_BOOL=false ;;
            *)
              echo "::error ::Input '${1}' must be true or false (got '${2}')."
              exit 1
              ;;
          esac
        }

        PARSED_UINT=0
        parse_uint() {
          local raw
          raw="$(trim "${2:-}")"
          case "$raw" in
            ''|*[!0-9]*)
              echo "::error ::Input '${1}' must be a non-negative integer (got '${2}')."
              exit 1
              ;;
          esac
          # 10# keeps a leading zero from being read as octal.
          PARSED_UINT=$((10#$raw))
          if [ "$PARSED_UINT" -lt "${3:-0}" ]; then
            PARSED_UINT="${3:-0}"
          fi
        }

        # An RFC 4122 v4 UUID, used as the groupBuildId that ties every build of
        # a group together. `uuidgen` is missing on some slim runners and /proc
        # does not exist on macOS, so fall back through both to /dev/urandom.
        gen_uuid() {
          local hex hi seq
          if [ -r /proc/sys/kernel/random/uuid ]; then
            tr -d '\r\n' < /proc/sys/kernel/random/uuid
            return
          fi
          if command -v uuidgen >/dev/null 2>&1; then
            uuidgen | tr '[:upper:]' '[:lower:]' | tr -d '\r\n'
            return
          fi
          hex="$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')"
          # Byte 6 carries the version nibble, byte 8 the variant bits.
          hi=$(( 0x${hex:12:2} & 0x0f | 0x40 ))
          seq=$(( 0x${hex:16:2} & 0x3f | 0x80 ))
          printf '%s-%s-%02x%s-%02x%s-%s' \
            "${hex:0:8}" "${hex:8:4}" "$hi" "${hex:14:2}" \
            "$seq" "${hex:18:2}" "${hex:20:12}"
        }

        KEY_ID="$(trim "${INPUT_KEY_ID:-}")"
        SECRET_KEY="$(trim "${INPUT_SECRET_KEY:-}")"
        ORG_ID="$(trim "${INPUT_UNITY_ORG_ID:-}")"
        PROJ_ID="$(trim "${INPUT_UNITY_PROJECT_ID:-}")"
        TARGET_ID="$(trim "${INPUT_BUILD_TARGET_ID:-}")"
        GROUP_QUERY="$(trim "${INPUT_BUILD_TARGET_GROUP_ID:-}")"
        BRANCH="$(trim "${INPUT_BRANCH:-}")"
        PLATFORM_IN="$(trim "${INPUT_PLATFORM:-}")"
        MACHINE_TYPE_LABEL="$(trim "${INPUT_MACHINE_TYPE_LABEL:-}")"
        API_URL="$(trim "${INPUT_API_URL:-}")"
        API_URL="${API_URL%/}"

        # Keep the credential out of the logs even if it was not passed as a secret.
        if [ -n "$SECRET_KEY" ]; then
          echo "::add-mask::${SECRET_KEY}"
        fi

        # Fail fast on missing required inputs instead of sending a doomed request.
        for pair in \
          "unity_org_id:${ORG_ID}" \
          "unity_project_id:${PROJ_ID}" \
          "unity_service_account_key_id:${KEY_ID}" \
          "unity_service_account_secret_key:${SECRET_KEY}" \
          "api_url:${API_URL}"
        do
          name="${pair%%:*}"
          value="${pair#*:}"
          if [ -z "$value" ]; then
            echo "::error ::Input '${name}' is required but was empty."
            exit 1
          fi
        done

        # A build target and a build target group name different sets of builds,
        # so accepting both would mean silently ignoring one of them.
        if [ -n "$TARGET_ID" ] && [ -n "$GROUP_QUERY" ]; then
          echo "::error ::Set either 'build_target_id' or 'build_target_group_id', not both."
          exit 1
        fi
        if [ -z "$TARGET_ID" ] && [ -z "$GROUP_QUERY" ]; then
          echo "::error ::One of 'build_target_id' or 'build_target_group_id' is required, but both were empty."
          exit 1
        fi

        # API v2 authenticates with HTTP Basic over base64("<keyId>:<secretKey>").
        # `base64` wraps long lines on GNU coreutils, so strip the newlines.
        BASIC_CREDENTIAL="$(printf '%s:%s' "$KEY_ID" "$SECRET_KEY" | base64 | tr -d '\r\n')"
        echo "::add-mask::${BASIC_CREDENTIAL}"
        AUTH_HEADER="Authorization: Basic ${BASIC_CREDENTIAL}"
        echo "::add-mask::${AUTH_HEADER}"

        # This action speaks v2 only, and v1 does not accept service account
        # credentials, so a v1 base URL can only ever produce a confusing 401.
        case "$API_URL" in
          *build-api.cloud.unity3d.com*)
            echo "::error ::'api_url' points at Unity Build Automation API v1, which this action no longer supports (Unity removes it on 2026-12-21). Drop the 'api_url' override to use v2, or pin an older release of this action."
            exit 1
            ;;
        esac

        parse_bool 'clean' "${INPUT_CLEAN:-}"
        CLEAN_FLAG="$PARSED_BOOL"

        parse_bool 'wait_for_completion' "${INPUT_WAIT_FOR_COMPLETION:-}"
        WAIT_FLAG="$PARSED_BOOL"

        # Polling settings only matter while waiting, but validate them either
        # way so a typo is caught on the first run rather than the first wait.
        parse_uint 'poll_interval_seconds' "${INPUT_POLL_INTERVAL_SECONDS:-30}" 5
        POLL_INTERVAL="$PARSED_UINT"

        parse_uint 'timeout_minutes' "${INPUT_TIMEOUT_MINUTES:-90}" 0
        TIMEOUT_MINUTES="$PARSED_UINT"

        # Write responses outside the workspace so the caller's checkout stays clean.
        RESPONSE_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/unity-cloud-build-response.XXXXXX")"
        trap 'rm -f "$RESPONSE_FILE"' EXIT

        # A successful trigger returns HTTP 202 with a single-element array;
        # tolerate a bare object too. Errors are always bare objects.
        FIRST_ENTRY='if type == "array" then (.[0] // {}) else . end'

        # v2 reports errors in the RFC 7807 shape: 'detail' carries the
        # explanation, 'title' the status text, 'requestId' the trace ID.
        API_ERROR=''
        read_api_error() {
          API_ERROR="$(jq -r "${FIRST_ENTRY} | (.detail // .title // empty)" "$1" 2>/dev/null || true)"
          local request_id
          request_id="$(jq -r "${FIRST_ENTRY} | (.requestId // empty)" "$1" 2>/dev/null || true)"
          if [ -z "$API_ERROR" ]; then
            # Not JSON (or no message field) — fall back to a truncated raw body.
            API_ERROR="$(head -c 500 "$1" | tr -d '\r\n')"
          fi
          if [ -n "$request_id" ]; then
            # Unity support asks for this when investigating a failed request.
            API_ERROR="${API_ERROR} (requestId: ${request_id})"
          fi
          if [ -z "$API_ERROR" ]; then
            API_ERROR='<empty response>'
          fi
        }

        # ---------------------------------------------------------------------
        # Work out which build targets to build.
        # ---------------------------------------------------------------------

        TARGETS=()
        GROUP_ID=''
        GROUP_NAME=''
        GROUP_BUILD_ID=''

        if [ -n "$GROUP_QUERY" ]; then
          GROUPS_URL="${API_URL}/orgs/${ORG_ID}/projects/${PROJ_ID}/buildTargetGroups"

          # Listing groups is a plain GET, so unlike the trigger it is safe to
          # repeat after any failure.
          GROUPS_CODE=''
          GROUPS_RC=0
          for attempt in 1 2 3; do
            set +e
            GROUPS_CODE="$(curl -sS -w '%{http_code}' -o "$RESPONSE_FILE" \
              -H "$AUTH_HEADER" \
              -H 'Accept: application/json' \
              --connect-timeout 15 \
              --max-time 60 \
              "$GROUPS_URL")"
            GROUPS_RC=$?
            set -e

            if [ "$GROUPS_RC" -eq 0 ] && [[ "$GROUPS_CODE" =~ ^2 ]]; then
              break
            fi
            # Credentials and a missing project will not fix themselves.
            if [ "$GROUPS_CODE" = '401' ] || [ "$GROUPS_CODE" = '403' ] || [ "$GROUPS_CODE" = '404' ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning ::Could not list build target groups (curl exit ${GROUPS_RC}, HTTP ${GROUPS_CODE}); retrying (attempt ${attempt}/3)."
              sleep $((attempt * 2))
            fi
          done

          if [ "$GROUPS_RC" -ne 0 ] || [[ ! "$GROUPS_CODE" =~ ^2 ]]; then
            read_api_error "$RESPONSE_FILE"
            if [ "$GROUPS_CODE" = '401' ] || [ "$GROUPS_CODE" = '403' ]; then
              echo "::error ::Could not list the build target groups of project ${PROJ_ID}: HTTP ${GROUPS_CODE} – ${API_ERROR}. Check that the service account key and secret are correct and that the account has a Build Automation role on this project; the legacy Build Automation API key is not accepted by API v2."
            else
              echo "::error ::Could not list the build target groups of project ${PROJ_ID} (curl exit ${GROUPS_RC}, HTTP ${GROUPS_CODE}): ${API_ERROR}. No build was triggered."
            fi
            exit 1
          fi

          if [ "${RUNNER_DEBUG:-}" = '1' ]; then
            echo "::debug ::HTTP ${GROUPS_CODE} $(tr -d '\r\n' < "$RESPONSE_FILE")"
          fi

          # v2 wraps the list in `data`; tolerate a bare array. Deleted groups
          # are still listed, and must never be matched.
          GROUPS_FILTER='(if type == "array" then . else (.data // []) end) | map(select(.deleted != true))'

          # Match on the group ID first: it is unique, whereas two groups can
          # share a name.
          MATCHES="$(jq -c --arg q "$GROUP_QUERY" "${GROUPS_FILTER} | map(select(.id == \$q))" "$RESPONSE_FILE")"
          if [ "$(jq -r 'length' <<< "$MATCHES")" -eq 0 ]; then
            MATCHES="$(jq -c --arg q "$GROUP_QUERY" "${GROUPS_FILTER} | map(select((.name // \"\") == \$q))" "$RESPONSE_FILE")"
          fi
          if [ "$(jq -r 'length' <<< "$MATCHES")" -eq 0 ]; then
            MATCHES="$(jq -c --arg q "$GROUP_QUERY" "${GROUPS_FILTER} | map(select(((.name // \"\") | ascii_downcase) == (\$q | ascii_downcase)))" "$RESPONSE_FILE")"
          fi

          MATCH_COUNT="$(jq -r 'length' <<< "$MATCHES")"
          if [ "$MATCH_COUNT" -eq 0 ]; then
            echo "::error ::No build target group with the ID or name '${GROUP_QUERY}' exists in project ${PROJ_ID}."
            KNOWN="$(jq -r "${GROUPS_FILTER} | map(\"  - \" + (.name // \"<unnamed>\") + \" (id: \" + (.id // \"?\") + \")\") | join(\"\n\")" "$RESPONSE_FILE")"
            if [ -n "$KNOWN" ]; then
              echo "Build target groups in this project:"
              echo "$KNOWN"
            else
              echo "This project has no build target groups."
            fi
            exit 1
          fi
          if [ "$MATCH_COUNT" -gt 1 ]; then
            echo "::error ::'${GROUP_QUERY}' matches ${MATCH_COUNT} build target groups by name; pass the group ID instead: $(jq -r 'map(.id // "?") | join(", ")' <<< "$MATCHES")"
            exit 1
          fi

          GROUP_ID="$(jq -r '.[0].id // empty' <<< "$MATCHES")"
          GROUP_NAME="$(jq -r '.[0].name // empty' <<< "$MATCHES")"
          if [ -z "$GROUP_ID" ]; then
            echo "::error ::The build target group matching '${GROUP_QUERY}' has no ID; the API returned: $(jq -c '.[0]' <<< "$MATCHES")"
            exit 1
          fi
          if [ "$(jq -r '.[0].enabled' <<< "$MATCHES")" = 'false' ]; then
            # Disabled only stops Unity building the group on its own; an
            # explicit trigger is still honoured.
            echo "::warning ::Build target group '${GROUP_NAME:-$GROUP_ID}' is disabled in Unity; building it anyway because this workflow asked for it."
          fi

          # A build target disabled inside the group is one Unity itself would
          # skip, and triggering it returns an error instead of a build.
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              TARGETS+=("$line")
            fi
          done < <(jq -r '.[0].buildTargets // [] | map(select(.enabled != false)) | .[] | (.buildTargetId // empty)' <<< "$MATCHES")

          SKIPPED="$(jq -r '.[0].buildTargets // [] | map(select(.enabled == false)) | map(.buildTargetId // "?") | join(", ")' <<< "$MATCHES")"
          if [ -n "$SKIPPED" ]; then
            echo "Skipping build targets that are disabled in the group: ${SKIPPED}"
          fi

          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "::error ::Build target group '${GROUP_NAME:-$GROUP_ID}' has no enabled build targets, so there is nothing to build."
            exit 1
          fi

          GROUP_BUILD_ID="$(gen_uuid)"
          echo "Build target group '${GROUP_NAME:-$GROUP_ID}' (${GROUP_ID}): building ${#TARGETS[@]} target(s) under group build ID ${GROUP_BUILD_ID}."
        else
          TARGETS=("$TARGET_ID")
        fi

        # ---------------------------------------------------------------------
        # Trigger a build for every target.
        # ---------------------------------------------------------------------

        # Optional fields are omitted entirely so the build target defaults apply.
        # The group fields are what tie a group's builds together in the
        # dashboard, and the API rejects either one without the other.
        PAYLOAD="$(jq -n -c \
          --argjson clean "$CLEAN_FLAG" \
          --arg branch "$BRANCH" \
          --arg platform "$PLATFORM_IN" \
          --arg machineTypeLabel "$MACHINE_TYPE_LABEL" \
          --arg groupId "$GROUP_ID" \
          --arg groupBuildId "$GROUP_BUILD_ID" \
          '{ clean: $clean, delay: 0 }
           + (if $branch == "" then {} else { branch: $branch } end)
           + (if $platform == "" then {} else { platform: $platform } end)
           + (if $machineTypeLabel == "" then {} else { machineTypeLabel: $machineTypeLabel } end)
           + (if $groupId == "" then {} else { buildTargetGroupIds: [$groupId], groupBuildId: $groupBuildId } end)')"

        BUILDS='[]'
        TRIGGER_FAILURES=0

        for TARGET in "${TARGETS[@]}"; do
          URL="${API_URL}/orgs/${ORG_ID}/projects/${PROJ_ID}/buildtargets/${TARGET}/builds"

          echo "Triggering build: target=${TARGET} branch=${BRANCH:-<build target default>} clean=${CLEAN_FLAG}"

          # Triggering a build is NOT idempotent, so never retry a request that
          # the server may already have acted on. Only DNS (6) and connect (7)
          # failures are retried: in both cases nothing reached Unity.
          HTTP_CODE=''
          CURL_RC=0
          for attempt in 1 2 3; do
            set +e
            HTTP_CODE="$(curl -sS -w '%{http_code}' -o "$RESPONSE_FILE" \
              -X POST \
              -H "$AUTH_HEADER" \
              -H 'Content-Type: application/json' \
              --connect-timeout 15 \
              --max-time 120 \
              --data "$PAYLOAD" \
              "$URL")"
            CURL_RC=$?
            set -e

            if [ "$CURL_RC" -eq 0 ]; then
              break
            fi
            if [ "$CURL_RC" -ne 6 ] && [ "$CURL_RC" -ne 7 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning ::Could not connect to the Unity Build Automation API (curl exit ${CURL_RC}); retrying (attempt ${attempt}/3)."
              sleep $((attempt * 2))
            fi
          done

          if [ "$CURL_RC" -ne 0 ]; then
            echo "::error ::Request to the Unity Build Automation API failed (curl exit ${CURL_RC}). No build was triggered for build target '${TARGET}'."
            TRIGGER_FAILURES=$((TRIGGER_FAILURES + 1))
            continue
          fi

          if [ "${RUNNER_DEBUG:-}" = '1' ]; then
            echo "::debug ::HTTP ${HTTP_CODE} $(tr -d '\r\n' < "$RESPONSE_FILE")"
          fi

          if [[ ! "$HTTP_CODE" =~ ^2 ]]; then
            read_api_error "$RESPONSE_FILE"
            if [ "$HTTP_CODE" = '401' ] || [ "$HTTP_CODE" = '403' ]; then
              echo "::error ::Failed to trigger build for '${TARGET}': HTTP ${HTTP_CODE} – ${API_ERROR}. Check that the service account key and secret are correct and that the account has a Build Automation role on this project; the legacy Build Automation API key is not accepted by API v2."
            else
              echo "::error ::Failed to trigger build for '${TARGET}': HTTP ${HTTP_CODE} – ${API_ERROR}"
            fi
            TRIGGER_FAILURES=$((TRIGGER_FAILURES + 1))
            continue
          fi

          # One POST answers with one entry per build target it acted on — more
          # than one when the target is `_all`. Each entry carries either a
          # build number or an 'error' saying why no build was started.
          ENTRIES="$(jq -c --arg t "$TARGET" \
            '(if type == "array" then . else [.] end)
             | map({ buildTargetId: (.buildtargetid // $t),
                     build: .build,
                     platform: (.platform // ""),
                     buildStatus: (.buildStatus // ""),
                     queuedReason: (.queuedReason // ""),
                     error: (.error // "") })' "$RESPONSE_FILE" 2>/dev/null || echo '[]')"

          if [ "$(jq -r 'length' <<< "$ENTRIES")" -eq 0 ]; then
            echo "::error ::Unity Build Automation returned HTTP ${HTTP_CODE} for '${TARGET}' but no build: $(head -c 500 "$RESPONSE_FILE" | tr -d '\r\n')"
            TRIGGER_FAILURES=$((TRIGGER_FAILURES + 1))
            continue
          fi

          # A 2xx can still carry a per-target 'error' — e.g. a build for that
          # target is already running — in which case no build was started.
          REJECTED="$(jq -c 'map(select(.build == null))' <<< "$ENTRIES")"
          REJECTED_COUNT="$(jq -r 'length' <<< "$REJECTED")"
          if [ "$REJECTED_COUNT" -gt 0 ]; then
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "::error ::Unity Build Automation did not start a build for build target ${line}"
              fi
            done < <(jq -r --arg code "$HTTP_CODE" \
              '.[] | .buildTargetId + ": "
                     + (if .error != "" then .error
                        else "HTTP " + $code + " carried no build ID." end)' <<< "$REJECTED")
            TRIGGER_FAILURES=$((TRIGGER_FAILURES + REJECTED_COUNT))
          fi

          STARTED="$(jq -c 'map(select(.build != null) | del(.error))' <<< "$ENTRIES")"
          if [ "$(jq -r 'length' <<< "$STARTED")" -gt 0 ]; then
            BUILDS="$(jq -c --argjson started "$STARTED" '. + $started' <<< "$BUILDS")"
          fi
        done

        BUILD_COUNT="$(jq -r 'length' <<< "$BUILDS")"
        if [ "$BUILD_COUNT" -eq 0 ]; then
          echo "::error ::No build was started (see the errors above)."
          exit 1
        fi

        # The single-build outputs stay meaningful only while there is exactly
        # one build; with several there is no build the singular could name.
        BUILD_ID=''
        PLATFORM_OUT=''
        BUILD_STATUS=''
        QUEUED_REASON=''
        if [ "$BUILD_COUNT" -eq 1 ]; then
          BUILD_ID="$(jq -r '.[0].build' <<< "$BUILDS")"
          PLATFORM_OUT="$(jq -r '.[0].platform' <<< "$BUILDS")"
          BUILD_STATUS="$(jq -r '.[0].buildStatus' <<< "$BUILDS")"
          QUEUED_REASON="$(jq -r '.[0].queuedReason' <<< "$BUILDS")"
        fi

        {
          echo "build_id=${BUILD_ID}"
          echo "platform=${PLATFORM_OUT}"
          echo "build_status=${BUILD_STATUS}"
          echo "queued_reason=${QUEUED_REASON}"
          echo "builds=${BUILDS}"
          echo "build_count=${BUILD_COUNT}"
          echo "group_build_id=${GROUP_BUILD_ID}"
          echo "build_target_group_id=${GROUP_ID}"
        } >> "$GITHUB_OUTPUT"

        {
          if [ "$BUILD_COUNT" -eq 1 ]; then
            echo "### Unity Build Automation build triggered"
          else
            echo "### Unity Build Automation builds triggered (${BUILD_COUNT})"
          fi
          echo ""
          if [ -n "$GROUP_ID" ]; then
            echo "Build target group \`${GROUP_NAME:-$GROUP_ID}\` (\`${GROUP_ID}\`), group build ID \`${GROUP_BUILD_ID}\`."
            echo ""
          fi
          echo "Branch \`${BRANCH:-<build target default>}\`, clean \`${CLEAN_FLAG}\`."
          echo ""
          # The queue reason is worth surfacing even without waiting: it says
          # whether a build is merely waiting its turn or waiting for a machine
          # to exist.
          echo "| Build target | Build ID | Platform | Status | Queue reason |"
          echo "| --- | --- | --- | --- | --- |"
          jq -r '.[] | "| `" + .buildTargetId
                     + "` | `" + (.build | tostring)
                     + "` | `" + (if .platform == "" then "unknown" else .platform end)
                     + "` | `" + (if .buildStatus == "" then "unknown" else .buildStatus end)
                     + "` | " + (if .queuedReason == "" then "" else "`" + .queuedReason + "`" end)
                     + " |"' <<< "$BUILDS"
        } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

        if [ "$BUILD_COUNT" -eq 1 ]; then
          echo "::notice ::Build triggered successfully. ID=${BUILD_ID}"
        else
          echo "::notice ::${BUILD_COUNT} builds triggered successfully. IDs=$(jq -r 'map(.build | tostring) | join(", ")' <<< "$BUILDS")"
        fi

        if [ "$TRIGGER_FAILURES" -gt 0 ]; then
          # Some builds are running, so say what did start before failing —
          # waiting for a run that is already doomed only burns runner minutes.
          echo "::error ::${TRIGGER_FAILURES} build target(s) did not start a build (see the errors above); ${BUILD_COUNT} did and are still running."
          exit 1
        fi

        if [ "$WAIT_FLAG" != 'true' ]; then
          # Unity can still cancel these builds while they sit in the queue, and
          # this step has already reported success by then, so say so once.
          echo "Not waiting for the build(s) to finish (wait_for_completion is false); their outcome will not affect this job."
          exit 0
        fi

        # ---------------------------------------------------------------------
        # Wait for every build to reach a terminal state.
        # ---------------------------------------------------------------------

        POLL_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/unity-cloud-build-poll.XXXXXX")"
        trap 'rm -f "$RESPONSE_FILE" "$POLL_FILE"' EXIT

        DEADLINE=0
        if [ "$TIMEOUT_MINUTES" -gt 0 ]; then
          DEADLINE=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
          echo "Waiting for ${BUILD_COUNT} build(s) (polling every ${POLL_INTERVAL}s, giving up after ${TIMEOUT_MINUTES}m)."
        else
          echo "Waiting for ${BUILD_COUNT} build(s) (polling every ${POLL_INTERVAL}s, no timeout)."
        fi

        # Per-build bookkeeping keyed by "<target>#<build>": how many reads in a
        # row failed, and the last progress line logged. A JSON object rather
        # than an associative array, which needs bash 4 (macOS runners ship 3.2).
        POLL_STATE='{}'
        PENDING="$BUILDS"
        FINALS='[]'

        # `unknown` is terminal too: Unity uses it for builds it has lost track
        # of, so waiting for it to change would hang until the timeout.
        while :; do
          REMAINING='[]'

          while IFS=$'\t' read -r POLL_TARGET POLL_BUILD; do
            if [ -z "$POLL_BUILD" ]; then
              continue
            fi
            POLL_KEY="${POLL_TARGET}#${POLL_BUILD}"
            POLL_URL="${API_URL}/orgs/${ORG_ID}/projects/${PROJ_ID}/buildtargets/${POLL_TARGET}/builds/${POLL_BUILD}"

            set +e
            POLL_CODE="$(curl -sS -w '%{http_code}' -o "$POLL_FILE" \
              -H "$AUTH_HEADER" \
              -H 'Accept: application/json' \
              --connect-timeout 15 \
              --max-time 60 \
              "$POLL_URL")"
            POLL_RC=$?
            set -e

            if [ "$POLL_RC" -ne 0 ] || [[ ! "$POLL_CODE" =~ ^2 ]]; then
              if [ "$POLL_CODE" = '401' ] || [ "$POLL_CODE" = '403' ]; then
                # Credentials that could trigger a build but cannot read it back
                # will not start working on the next poll.
                echo "::error ::Build ${POLL_BUILD} of ${POLL_TARGET} was triggered, but reading its status returned HTTP ${POLL_CODE}. Give the service account a role that can read builds, or turn off 'wait_for_completion'."
                exit 1
              fi
              POLL_ERRORS="$(jq -r --arg k "$POLL_KEY" '(.[$k].errors // 0) + 1' <<< "$POLL_STATE")"
              POLL_STATE="$(jq -c --arg k "$POLL_KEY" --argjson e "$POLL_ERRORS" '.[$k] = ((.[$k] // {}) + { errors: $e })' <<< "$POLL_STATE")"
              if [ "$POLL_ERRORS" -ge 5 ]; then
                echo "::error ::Could not read the status of build ${POLL_BUILD} of ${POLL_TARGET} after ${POLL_ERRORS} attempts (last: curl exit ${POLL_RC}, HTTP ${POLL_CODE}). The build itself is unaffected and may still be running."
                exit 1
              fi
              echo "::warning ::Could not read the status of build ${POLL_BUILD} of ${POLL_TARGET} (curl exit ${POLL_RC}, HTTP ${POLL_CODE}); retrying (${POLL_ERRORS}/5)."
              REMAINING="$(jq -c --arg t "$POLL_TARGET" --argjson b "$POLL_BUILD" '. + [{ buildTargetId: $t, build: $b }]' <<< "$REMAINING")"
              continue
            fi

            POLL_STATE="$(jq -c --arg k "$POLL_KEY" '.[$k] = ((.[$k] // {}) + { errors: 0 })' <<< "$POLL_STATE")"
            STATUS="$(jq -r "${FIRST_ENTRY} | (.buildStatus // empty)" "$POLL_FILE" 2>/dev/null || true)"
            QUEUED_REASON="$(jq -r "${FIRST_ENTRY} | (.queuedReason // empty)" "$POLL_FILE" 2>/dev/null || true)"

            case "$STATUS" in
              success|failure|canceled|unknown)
                # Unity leaves `canceledBy` null for some cancellations, so the
                # checkout timestamp is what separates "died in the queue" from
                # "died once it was building". A failed build usually carries
                # per-stage details; keep the first few for the report below.
                ENTRY_CANCELED_BY="$(jq -r "${FIRST_ENTRY} | (.canceledBy // empty)" "$POLL_FILE" 2>/dev/null || true)"
                ENTRY_CHECKOUT="$(jq -r "${FIRST_ENTRY} | (.checkoutStartTime // empty)" "$POLL_FILE" 2>/dev/null || true)"
                ENTRY_FAILURES="$(jq -r "${FIRST_ENTRY} | [(.failureDetails // [])[] | \"  - \" + ((.stage // \"?\") | tostring) + \": \" + ((.publicMessage // .label // \"\") | tostring)] | .[0:5] | join(\"\n\")" "$POLL_FILE" 2>/dev/null || true)"
                FINALS="$(jq -c \
                  --arg t "$POLL_TARGET" \
                  --argjson b "$POLL_BUILD" \
                  --arg s "$STATUS" \
                  --arg c "$ENTRY_CANCELED_BY" \
                  --arg co "$ENTRY_CHECKOUT" \
                  --arg f "$ENTRY_FAILURES" \
                  '. + [{ buildTargetId: $t, build: $b, finalStatus: $s, canceledBy: $c, checkoutStartTime: $co, failures: $f }]' <<< "$FINALS")"
                echo "Build ${POLL_BUILD} of ${POLL_TARGET}: ${STATUS}"
                ;;
              *)
                PROGRESS="${STATUS:-unknown}"
                if [ -n "$QUEUED_REASON" ]; then
                  PROGRESS="${PROGRESS} (${QUEUED_REASON})"
                fi
                if [ "$PROGRESS" != "$(jq -r --arg k "$POLL_KEY" '.[$k].logged // ""' <<< "$POLL_STATE")" ]; then
                  echo "Build ${POLL_BUILD} of ${POLL_TARGET}: ${PROGRESS}"
                  POLL_STATE="$(jq -c --arg k "$POLL_KEY" --arg p "$PROGRESS" '.[$k] = ((.[$k] // {}) + { logged: $p })' <<< "$POLL_STATE")"
                fi
                REMAINING="$(jq -c --arg t "$POLL_TARGET" --argjson b "$POLL_BUILD" '. + [{ buildTargetId: $t, build: $b }]' <<< "$REMAINING")"
                ;;
            esac
          done < <(jq -r '.[] | .buildTargetId + "\t" + (.build | tostring)' <<< "$PENDING")

          PENDING="$REMAINING"
          if [ "$(jq -r 'length' <<< "$PENDING")" -eq 0 ]; then
            break
          fi

          if [ "$DEADLINE" -ne 0 ] && [ "$(date +%s)" -ge "$DEADLINE" ]; then
            {
              echo "final_build_status="
              echo "canceled_by="
              echo "final_builds="
            } >> "$GITHUB_OUTPUT"
            echo "::error ::Gave up waiting after ${TIMEOUT_MINUTES} minutes; still not finished: $(jq -r 'map(.buildTargetId + " #" + (.build | tostring)) | join(", ")' <<< "$PENDING"). The build(s) have NOT been canceled and may still finish; raise 'timeout_minutes' if this is normal for these targets."
            exit 1
          fi

          sleep "$POLL_INTERVAL"
        done

        TOTAL_FINAL="$(jq -r 'length' <<< "$FINALS")"
        SUCCESSES="$(jq -r 'map(select(.finalStatus == "success")) | length' <<< "$FINALS")"

        # With several builds there is no single build the singular outputs
        # could name, so they describe the first build that did not succeed.
        FINAL_STATUS='success'
        CANCELED_BY=''
        if [ "$SUCCESSES" -ne "$TOTAL_FINAL" ]; then
          FINAL_STATUS="$(jq -r 'map(select(.finalStatus != "success")) | .[0].finalStatus' <<< "$FINALS")"
          CANCELED_BY="$(jq -r 'map(select(.finalStatus != "success")) | .[0].canceledBy' <<< "$FINALS")"
        fi

        {
          echo "final_build_status=${FINAL_STATUS}"
          echo "canceled_by=${CANCELED_BY}"
          echo "final_builds=$(jq -c 'map({ buildTargetId: .buildTargetId, build: .build, finalStatus: .finalStatus, canceledBy: .canceledBy })' <<< "$FINALS")"
        } >> "$GITHUB_OUTPUT"

        {
          echo ""
          echo "| Build target | Build ID | Final status | Canceled by |"
          echo "| --- | --- | --- | --- |"
          jq -r '.[] | "| `" + .buildTargetId
                     + "` | `" + (.build | tostring)
                     + "` | `" + .finalStatus
                     + "` | " + (if .canceledBy == "" then "" else "`" + .canceledBy + "`" end)
                     + " |"' <<< "$FINALS"
        } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

        if [ "$SUCCESSES" -eq "$TOTAL_FINAL" ]; then
          if [ "$TOTAL_FINAL" -eq 1 ]; then
            echo "::notice ::Build $(jq -r '.[0].build' <<< "$FINALS") finished successfully."
          else
            echo "::notice ::All ${TOTAL_FINAL} builds finished successfully."
          fi
          exit 0
        fi

        # `canceledBy` is the only thing that distinguishes "somebody pressed
        # cancel" from the queue, billing and configuration cases, all of
        # which look identical in the dashboard: 0s checkout, no commit.
        WHY=''
        explain_cancel() {
          case "${1:-}" in
            concurrency-timelimit)
              WHY='it waited in the queue longer than Unity allows while another build held the concurrency slot. Stagger the triggers (a tag push and a branch push often fire together), raise the concurrent build limit, or re-run this job.'
              ;;
            billing-invalidsubscription)
              WHY='the organization has no valid Build Automation subscription, or it is out of build minutes.'
              ;;
            service-badconfiguration)
              WHY='Unity rejected the build target configuration.'
              ;;
            service-timelimit|jenkins-timelimit|evaluation-timelimit)
              WHY="it exceeded a Unity-side time limit (${1})."
              ;;
            restart-limit)
              WHY='it was restarted too many times.'
              ;;
            api)
              WHY='it was canceled from the dashboard or through the API.'
              ;;
            service)
              WHY='the Build Automation service canceled it.'
              ;;
            '')
              if [ -z "${2:-}" ]; then
                # Observed in practice: canceled, canceledBy null, checkout
                # never started. Nothing in the request or the repository can
                # cause this — the build died waiting.
                WHY='Unity did not attribute it to anyone and the checkout never started, so it was canceled while waiting for a build machine — nothing in this workflow or the repository can cause that. Check the build in the dashboard, whether the organization has build minutes left, and whether another build was created for the same build target while this one waited. If re-running reproduces it, the machine type or the build capacity of the organization is what to look at.'
              else
                WHY='Unity did not report a reason.'
              fi
              ;;
            *)
              WHY="Unity reported '${1}'."
              ;;
          esac
        }

        INDEX=0
        while [ "$INDEX" -lt "$TOTAL_FINAL" ]; do
          ENTRY="$(jq -c --argjson i "$INDEX" '.[$i]' <<< "$FINALS")"
          INDEX=$((INDEX + 1))

          ENTRY_STATUS="$(jq -r '.finalStatus' <<< "$ENTRY")"
          if [ "$ENTRY_STATUS" = 'success' ]; then
            continue
          fi
          ENTRY_TARGET="$(jq -r '.buildTargetId' <<< "$ENTRY")"
          ENTRY_BUILD="$(jq -r '.build' <<< "$ENTRY")"

          if [ "$ENTRY_STATUS" = 'canceled' ]; then
            explain_cancel "$(jq -r '.canceledBy' <<< "$ENTRY")" "$(jq -r '.checkoutStartTime' <<< "$ENTRY")"
            echo "::error ::Build ${ENTRY_BUILD} of ${ENTRY_TARGET} was canceled: ${WHY}"
            continue
          fi

          # The per-stage failure details say what broke without a trip to the
          # dashboard.
          ENTRY_FAILURES="$(jq -r '.failures' <<< "$ENTRY")"
          if [ -n "$ENTRY_FAILURES" ]; then
            echo "Reported failures for build ${ENTRY_BUILD} of ${ENTRY_TARGET}:"
            echo "$ENTRY_FAILURES"
          fi
          echo "::error ::Build ${ENTRY_BUILD} of ${ENTRY_TARGET} finished with status '${ENTRY_STATUS}'."
        done

        exit 1
