name: 'Unity Cloud Build Trigger'
description: 'Trigger a Unity Cloud Build for a given branch and return the build ID.'
author: 'matuyuhi'
branding:
  icon: 'upload-cloud'
  color: 'green'
inputs:
  unity_org_id:
    description: 'Your Unity Organization ID'
    required: true
  unity_project_id:
    description: 'Your Unity Project ID'
    required: true
  build_target_id:
    description: 'Your Build Target ID'
    required: true
  unity_service_account_key_id:
    description: >-
      Key ID of a Unity service account with a Build Automation role. Combined
      with `unity_service_account_secret_key` into the HTTP Basic credential
      required by API v2. The legacy Build Automation API key is not accepted.
    required: true
  unity_service_account_secret_key:
    description: >-
      Secret key of the Unity service account. Pass this as a secret; it is
      masked in the logs.
    required: true
  branch:
    description: >-
      Git branch to build. When empty, the branch configured on the build target
      is used.
    required: false
    default: ''
  clean:
    description: 'Whether to perform a clean build (true/false)'
    required: false
    default: 'false'
  platform:
    description: >-
      Build platform override (e.g. standalonewindows64). Sent to the API only
      when set; otherwise the build target default applies.
    required: false
    default: ''
  machine_type_label:
    description: >-
      Machine type label for the build machine (e.g. win_premium_v1). Sent to
      the API as machineTypeLabel only when set; otherwise the build target
      default applies.
    required: false
    default: ''
  wait_for_completion:
    description: >-
      Poll the build until it reaches a terminal state, and fail the step unless
      it succeeded. Off by default, in which case the action returns as soon as
      the build is queued — so a build Unity later cancels (for example because
      it waited too long behind another build) leaves the workflow green.
    required: false
    default: 'false'
  poll_interval_seconds:
    description: >-
      How often to poll the build status while waiting. Values below 5 are
      raised to 5 so the API is not hammered. Ignored unless
      `wait_for_completion` is enabled.
    required: false
    default: '30'
  timeout_minutes:
    description: >-
      Stop waiting after this many minutes and fail the step; the Unity build
      itself keeps running. `0` waits indefinitely (the job timeout still
      applies). Ignored unless `wait_for_completion` is enabled.
    required: false
    default: '90'
  api_url:
    description: >-
      Base URL of the Unity Build Automation API, including the version segment.
      This action speaks API v2 only; the v1 base URL is rejected.
    required: false
    default: 'https://build-automation.services.api.unity.com/v2'
outputs:
  build_id:
    description: 'The ID (build number) of the triggered build.'
    value: '${{ steps.trigger-build.outputs.build_id }}'
  platform:
    description: 'The platform of the build, as reported by the API.'
    value: '${{ steps.trigger-build.outputs.platform }}'
  build_status:
    description: >-
      The status the build was created with, as reported by the API (e.g.
      queued). Empty if the API did not report one.
    value: '${{ steps.trigger-build.outputs.build_status }}'
  queued_reason:
    description: >-
      Why the build is waiting, as reported by the API (e.g. targetConcurrency,
      waitingForBuildAgent). Empty if the API did not report one.
    value: '${{ steps.trigger-build.outputs.queued_reason }}'
  final_build_status:
    description: >-
      The terminal status of the build (success, failure, canceled, unknown).
      Only set when `wait_for_completion` is enabled and the build finished
      before the timeout.
    value: '${{ steps.trigger-build.outputs.final_build_status }}'
  canceled_by:
    description: >-
      Who or what canceled the build (e.g. concurrency-timelimit,
      billing-invalidsubscription, api). Only set when the build was canceled
      while `wait_for_completion` was enabled.
    value: '${{ steps.trigger-build.outputs.canceled_by }}'
runs:
  using: 'composite'
  steps:
    - name: Ensure `curl` and `jq` are available
      shell: bash
      run: |
        set -euo pipefail

        missing=()
        for cmd in curl jq; do
          command -v "$cmd" >/dev/null 2>&1 || missing+=("$cmd")
        done

        if [ ${#missing[@]} -eq 0 ]; then
          exit 0
        fi

        echo "Installing missing dependencies: ${missing[*]}"

        # apt-get needs root; brew must not run as root. Work out up front whether
        # we can elevate, so a non-root runner without sudo gets a clear message
        # instead of a bare permission error from apt-get.
        SUDO=''
        CAN_ELEVATE=1
        if [ "$(id -u)" -ne 0 ]; then
          if command -v sudo >/dev/null 2>&1; then
            SUDO='sudo'
          else
            CAN_ELEVATE=0
          fi
        fi

        if command -v apt-get >/dev/null 2>&1 && [ "$CAN_ELEVATE" -eq 1 ]; then
          $SUDO apt-get update
          $SUDO apt-get install -y "${missing[@]}"
        elif command -v brew >/dev/null 2>&1; then
          brew install "${missing[@]}"
        else
          if command -v apt-get >/dev/null 2>&1 && [ "$CAN_ELEVATE" -eq 0 ]; then
            reason='apt-get is available but this runner is neither root nor has sudo'
          else
            reason='no supported package manager (apt-get or brew) was found'
          fi
          echo "::error ::Missing required commands (${missing[*]}) and ${reason}. Please pre-install them on this runner."
          exit 1
        fi

    - name: Trigger Unity Cloud Build
      id: trigger-build
      shell: bash
      # Inputs are passed through the environment rather than interpolated into
      # the script, so that values containing shell metacharacters cannot be
      # executed as code.
      env:
        INPUT_KEY_ID: ${{ inputs.unity_service_account_key_id }}
        INPUT_SECRET_KEY: ${{ inputs.unity_service_account_secret_key }}
        INPUT_UNITY_ORG_ID: ${{ inputs.unity_org_id }}
        INPUT_UNITY_PROJECT_ID: ${{ inputs.unity_project_id }}
        INPUT_BUILD_TARGET_ID: ${{ inputs.build_target_id }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_CLEAN: ${{ inputs.clean }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_MACHINE_TYPE_LABEL: ${{ inputs.machine_type_label }}
        INPUT_WAIT_FOR_COMPLETION: ${{ inputs.wait_for_completion }}
        INPUT_POLL_INTERVAL_SECONDS: ${{ inputs.poll_interval_seconds }}
        INPUT_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        INPUT_API_URL: ${{ inputs.api_url }}
      run: |
        set -euo pipefail

        # Strip CR/LF (common when secrets are pasted) and surrounding spaces.
        trim() {
          printf '%s' "${1:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
        }

        # These set a global rather than echoing, because a `$(…)` subshell
        # cannot fail the step: its `exit` would only leave the subshell.
        PARSED_BOOL=''
        parse_bool() {
          case "$(printf '%s' "${2:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
            true|1|yes)    PARSED_BOOL=true ;;
            ''|false|0|no) PARSED_BOOL=false ;;
            *)
              echo "::error ::Input '${1}' must be true or false (got '${2}')."
              exit 1
              ;;
          esac
        }

        PARSED_UINT=0
        parse_uint() {
          local raw
          raw="$(trim "${2:-}")"
          case "$raw" in
            ''|*[!0-9]*)
              echo "::error ::Input '${1}' must be a non-negative integer (got '${2}')."
              exit 1
              ;;
          esac
          # 10# keeps a leading zero from being read as octal.
          PARSED_UINT=$((10#$raw))
          if [ "$PARSED_UINT" -lt "${3:-0}" ]; then
            PARSED_UINT="${3:-0}"
          fi
        }

        KEY_ID="$(trim "${INPUT_KEY_ID:-}")"
        SECRET_KEY="$(trim "${INPUT_SECRET_KEY:-}")"
        ORG_ID="$(trim "${INPUT_UNITY_ORG_ID:-}")"
        PROJ_ID="$(trim "${INPUT_UNITY_PROJECT_ID:-}")"
        TARGET_ID="$(trim "${INPUT_BUILD_TARGET_ID:-}")"
        BRANCH="$(trim "${INPUT_BRANCH:-}")"
        PLATFORM_IN="$(trim "${INPUT_PLATFORM:-}")"
        MACHINE_TYPE_LABEL="$(trim "${INPUT_MACHINE_TYPE_LABEL:-}")"
        API_URL="$(trim "${INPUT_API_URL:-}")"
        API_URL="${API_URL%/}"

        # Keep the credential out of the logs even if it was not passed as a secret.
        if [ -n "$SECRET_KEY" ]; then
          echo "::add-mask::${SECRET_KEY}"
        fi

        # Fail fast on missing required inputs instead of sending a doomed request.
        for pair in \
          "unity_org_id:${ORG_ID}" \
          "unity_project_id:${PROJ_ID}" \
          "build_target_id:${TARGET_ID}" \
          "unity_service_account_key_id:${KEY_ID}" \
          "unity_service_account_secret_key:${SECRET_KEY}" \
          "api_url:${API_URL}"
        do
          name="${pair%%:*}"
          value="${pair#*:}"
          if [ -z "$value" ]; then
            echo "::error ::Input '${name}' is required but was empty."
            exit 1
          fi
        done

        # API v2 authenticates with HTTP Basic over base64("<keyId>:<secretKey>").
        # `base64` wraps long lines on GNU coreutils, so strip the newlines.
        BASIC_CREDENTIAL="$(printf '%s:%s' "$KEY_ID" "$SECRET_KEY" | base64 | tr -d '\r\n')"
        echo "::add-mask::${BASIC_CREDENTIAL}"
        AUTH_HEADER="Authorization: Basic ${BASIC_CREDENTIAL}"
        echo "::add-mask::${AUTH_HEADER}"

        # This action speaks v2 only, and v1 does not accept service account
        # credentials, so a v1 base URL can only ever produce a confusing 401.
        case "$API_URL" in
          *build-api.cloud.unity3d.com*)
            echo "::error ::'api_url' points at Unity Build Automation API v1, which this action no longer supports (Unity removes it on 2026-12-21). Drop the 'api_url' override to use v2, or pin an older release of this action."
            exit 1
            ;;
        esac

        parse_bool 'clean' "${INPUT_CLEAN:-}"
        CLEAN_FLAG="$PARSED_BOOL"

        parse_bool 'wait_for_completion' "${INPUT_WAIT_FOR_COMPLETION:-}"
        WAIT_FLAG="$PARSED_BOOL"

        # Polling settings only matter while waiting, but validate them either
        # way so a typo is caught on the first run rather than the first wait.
        parse_uint 'poll_interval_seconds' "${INPUT_POLL_INTERVAL_SECONDS:-30}" 5
        POLL_INTERVAL="$PARSED_UINT"

        parse_uint 'timeout_minutes' "${INPUT_TIMEOUT_MINUTES:-90}" 0
        TIMEOUT_MINUTES="$PARSED_UINT"

        # Optional fields are omitted entirely so the build target defaults apply.
        PAYLOAD="$(jq -n -c \
          --argjson clean "$CLEAN_FLAG" \
          --arg branch "$BRANCH" \
          --arg platform "$PLATFORM_IN" \
          --arg machineTypeLabel "$MACHINE_TYPE_LABEL" \
          '{ clean: $clean, delay: 0 }
           + (if $branch == "" then {} else { branch: $branch } end)
           + (if $platform == "" then {} else { platform: $platform } end)
           + (if $machineTypeLabel == "" then {} else { machineTypeLabel: $machineTypeLabel } end)')"

        URL="${API_URL}/orgs/${ORG_ID}/projects/${PROJ_ID}/buildtargets/${TARGET_ID}/builds"

        # Write the response outside the workspace so the caller's checkout stays clean.
        RESPONSE_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/unity-cloud-build-response.XXXXXX")"
        trap 'rm -f "$RESPONSE_FILE"' EXIT

        echo "Triggering build: target=${TARGET_ID} branch=${BRANCH:-<build target default>} clean=${CLEAN_FLAG}"

        # Triggering a build is NOT idempotent, so never retry a request that the
        # server may already have acted on. Only DNS (6) and connect (7) failures
        # are retried: in both cases nothing reached Unity.
        HTTP_CODE=''
        CURL_RC=0
        for attempt in 1 2 3; do
          set +e
          HTTP_CODE="$(curl -sS -w '%{http_code}' -o "$RESPONSE_FILE" \
            -X POST \
            -H "$AUTH_HEADER" \
            -H 'Content-Type: application/json' \
            --connect-timeout 15 \
            --max-time 120 \
            --data "$PAYLOAD" \
            "$URL")"
          CURL_RC=$?
          set -e

          if [ "$CURL_RC" -eq 0 ]; then
            break
          fi
          if [ "$CURL_RC" -ne 6 ] && [ "$CURL_RC" -ne 7 ]; then
            break
          fi
          if [ "$attempt" -lt 3 ]; then
            echo "::warning ::Could not connect to the Unity Build Automation API (curl exit ${CURL_RC}); retrying (attempt ${attempt}/3)."
            sleep $((attempt * 2))
          fi
        done

        if [ "$CURL_RC" -ne 0 ]; then
          echo "::error ::Request to the Unity Build Automation API failed (curl exit ${CURL_RC}). No build was triggered."
          exit 1
        fi

        if [ "${RUNNER_DEBUG:-}" = '1' ]; then
          echo "::debug ::HTTP ${HTTP_CODE} $(tr -d '\r\n' < "$RESPONSE_FILE")"
        fi

        # A successful trigger returns HTTP 202 with a single-element array;
        # tolerate a bare object too. Errors are always bare objects.
        FIRST_ENTRY='if type == "array" then (.[0] // {}) else . end'

        if [[ ! "$HTTP_CODE" =~ ^2 ]]; then
          # v2 reports errors in the RFC 7807 shape: 'detail' carries the
          # explanation, 'title' the status text, 'requestId' the trace ID.
          ERROR_MSG="$(jq -r "${FIRST_ENTRY} | (.detail // .title // empty)" "$RESPONSE_FILE" 2>/dev/null || true)"
          REQUEST_ID="$(jq -r "${FIRST_ENTRY} | (.requestId // empty)" "$RESPONSE_FILE" 2>/dev/null || true)"
          if [ -z "$ERROR_MSG" ]; then
            # Not JSON (or no message field) — fall back to a truncated raw body.
            ERROR_MSG="$(head -c 500 "$RESPONSE_FILE" | tr -d '\r\n')"
          fi
          if [ -n "$REQUEST_ID" ]; then
            # Unity support asks for this when investigating a failed request.
            ERROR_MSG="${ERROR_MSG} (requestId: ${REQUEST_ID})"
          fi
          if [ "$HTTP_CODE" = '401' ] || [ "$HTTP_CODE" = '403' ]; then
            echo "::error ::Failed to trigger build: HTTP ${HTTP_CODE} – ${ERROR_MSG:-<empty response>}. Check that the service account key and secret are correct and that the account has a Build Automation role on this project; the legacy Build Automation API key is not accepted by API v2."
          else
            echo "::error ::Failed to trigger build: HTTP ${HTTP_CODE} – ${ERROR_MSG:-<empty response>}"
          fi
          exit 1
        fi

        BUILD_ID="$(jq -r "${FIRST_ENTRY} | (.build // empty)" "$RESPONSE_FILE" 2>/dev/null || true)"
        PLATFORM_OUT="$(jq -r "${FIRST_ENTRY} | (.platform // empty)" "$RESPONSE_FILE" 2>/dev/null || true)"
        BUILD_STATUS="$(jq -r "${FIRST_ENTRY} | (.buildStatus // empty)" "$RESPONSE_FILE" 2>/dev/null || true)"
        QUEUED_REASON="$(jq -r "${FIRST_ENTRY} | (.queuedReason // empty)" "$RESPONSE_FILE" 2>/dev/null || true)"

        if [ -z "$BUILD_ID" ]; then
          # A 2xx can still carry a per-target 'error' — e.g. a build for this
          # target is already running — in which case no build was started.
          ENTRY_ERROR="$(jq -r "${FIRST_ENTRY} | (.error // empty)" "$RESPONSE_FILE" 2>/dev/null || true)"
          if [ -n "$ENTRY_ERROR" ]; then
            echo "::error ::Unity Build Automation did not start a build: ${ENTRY_ERROR}"
          else
            echo "::error ::Unity Build Automation returned HTTP ${HTTP_CODE} but no build ID: $(head -c 500 "$RESPONSE_FILE" | tr -d '\r\n')"
          fi
          exit 1
        fi

        {
          echo "build_id=${BUILD_ID}"
          echo "platform=${PLATFORM_OUT}"
          echo "build_status=${BUILD_STATUS}"
          echo "queued_reason=${QUEUED_REASON}"
        } >> "$GITHUB_OUTPUT"

        {
          echo "### Unity Build Automation build triggered"
          echo ""
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Build ID | \`${BUILD_ID}\` |"
          echo "| Build target | \`${TARGET_ID}\` |"
          echo "| Branch | \`${BRANCH:-<build target default>}\` |"
          echo "| Platform | \`${PLATFORM_OUT:-unknown}\` |"
          echo "| Status | \`${BUILD_STATUS:-unknown}\` |"
          echo "| Clean | \`${CLEAN_FLAG}\` |"
        } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

        echo "::notice ::Build triggered successfully. ID=${BUILD_ID}"

        if [ "$WAIT_FLAG" != 'true' ]; then
          # Unity can still cancel this build while it sits in the queue, and
          # this step has already reported success by then, so say so once.
          echo "Not waiting for the build to finish (wait_for_completion is false); its outcome will not affect this job."
          exit 0
        fi

        # ---------------------------------------------------------------------
        # Wait for the build to reach a terminal state.
        # ---------------------------------------------------------------------

        POLL_URL="${URL}/${BUILD_ID}"
        POLL_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/unity-cloud-build-poll.XXXXXX")"
        trap 'rm -f "$RESPONSE_FILE" "$POLL_FILE"' EXIT

        DEADLINE=0
        if [ "$TIMEOUT_MINUTES" -gt 0 ]; then
          DEADLINE=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
          echo "Waiting for build ${BUILD_ID} (polling every ${POLL_INTERVAL}s, giving up after ${TIMEOUT_MINUTES}m)."
        else
          echo "Waiting for build ${BUILD_ID} (polling every ${POLL_INTERVAL}s, no timeout)."
        fi

        FINAL_STATUS=''
        CANCELED_BY=''
        CHECKOUT_START=''
        LAST_LOGGED=''
        POLL_ERRORS=0

        # `unknown` is terminal too: Unity uses it for builds it has lost track
        # of, so waiting for it to change would hang until the timeout.
        while :; do
          set +e
          POLL_CODE="$(curl -sS -w '%{http_code}' -o "$POLL_FILE" \
            -H "$AUTH_HEADER" \
            -H 'Accept: application/json' \
            --connect-timeout 15 \
            --max-time 60 \
            "$POLL_URL")"
          POLL_RC=$?
          set -e

          if [ "$POLL_RC" -ne 0 ] || [[ ! "$POLL_CODE" =~ ^2 ]]; then
            if [ "$POLL_CODE" = '401' ] || [ "$POLL_CODE" = '403' ]; then
              # Credentials that could trigger a build but cannot read it back
              # will not start working on the next poll.
              echo "::error ::Build ${BUILD_ID} was triggered, but reading its status returned HTTP ${POLL_CODE}. Give the service account a role that can read builds, or turn off 'wait_for_completion'."
              exit 1
            fi
            POLL_ERRORS=$((POLL_ERRORS + 1))
            if [ "$POLL_ERRORS" -ge 5 ]; then
              echo "::error ::Could not read the status of build ${BUILD_ID} after ${POLL_ERRORS} attempts (last: curl exit ${POLL_RC}, HTTP ${POLL_CODE}). The build itself is unaffected and may still be running."
              exit 1
            fi
            echo "::warning ::Could not read build status (curl exit ${POLL_RC}, HTTP ${POLL_CODE}); retrying (${POLL_ERRORS}/5)."
          else
            POLL_ERRORS=0
            STATUS="$(jq -r "${FIRST_ENTRY} | (.buildStatus // empty)" "$POLL_FILE" 2>/dev/null || true)"
            QUEUED_REASON="$(jq -r "${FIRST_ENTRY} | (.queuedReason // empty)" "$POLL_FILE" 2>/dev/null || true)"

            case "$STATUS" in
              success|failure|canceled|unknown)
                FINAL_STATUS="$STATUS"
                CANCELED_BY="$(jq -r "${FIRST_ENTRY} | (.canceledBy // empty)" "$POLL_FILE" 2>/dev/null || true)"
                # Unity leaves `canceledBy` null for some cancellations, so the
                # checkout timestamp is what separates "died in the queue" from
                # "died once it was building".
                CHECKOUT_START="$(jq -r "${FIRST_ENTRY} | (.checkoutStartTime // empty)" "$POLL_FILE" 2>/dev/null || true)"
                break
                ;;
              *)
                PROGRESS="${STATUS:-unknown}"
                if [ -n "$QUEUED_REASON" ]; then
                  PROGRESS="${PROGRESS} (${QUEUED_REASON})"
                fi
                if [ "$PROGRESS" != "$LAST_LOGGED" ]; then
                  echo "Build ${BUILD_ID}: ${PROGRESS}"
                  LAST_LOGGED="$PROGRESS"
                fi
                ;;
            esac
          fi

          if [ "$DEADLINE" -ne 0 ] && [ "$(date +%s)" -ge "$DEADLINE" ]; then
            echo "final_build_status=" >> "$GITHUB_OUTPUT"
            echo "canceled_by=" >> "$GITHUB_OUTPUT"
            echo "::error ::Gave up waiting for build ${BUILD_ID} after ${TIMEOUT_MINUTES} minutes (last known status: ${LAST_LOGGED:-unknown}). The build has NOT been canceled and may still finish; raise 'timeout_minutes' if this is normal for this target."
            exit 1
          fi

          sleep "$POLL_INTERVAL"
        done

        {
          echo "final_build_status=${FINAL_STATUS}"
          echo "canceled_by=${CANCELED_BY}"
        } >> "$GITHUB_OUTPUT"

        {
          echo ""
          echo "| Final status | \`${FINAL_STATUS}\` |"
        } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

        if [ "$FINAL_STATUS" = 'success' ]; then
          echo "::notice ::Build ${BUILD_ID} finished successfully."
          exit 0
        fi

        if [ "$FINAL_STATUS" = 'canceled' ]; then
          # `canceledBy` is the only thing that distinguishes "somebody pressed
          # cancel" from the queue, billing and configuration cases, all of
          # which look identical in the dashboard: 0s checkout, no commit.
          case "$CANCELED_BY" in
            concurrency-timelimit)
              WHY='it waited in the queue longer than Unity allows while another build held the concurrency slot. Stagger the triggers (a tag push and a branch push often fire together), raise the concurrent build limit, or re-run this job.'
              ;;
            billing-invalidsubscription)
              WHY='the organization has no valid Build Automation subscription, or it is out of build minutes.'
              ;;
            service-badconfiguration)
              WHY='Unity rejected the build target configuration.'
              ;;
            service-timelimit|jenkins-timelimit|evaluation-timelimit)
              WHY="it exceeded a Unity-side time limit (${CANCELED_BY})."
              ;;
            restart-limit)
              WHY='it was restarted too many times.'
              ;;
            api)
              WHY='it was canceled from the dashboard or through the API.'
              ;;
            service)
              WHY='the Build Automation service canceled it.'
              ;;
            '')
              if [ -z "$CHECKOUT_START" ]; then
                # Observed in practice: canceled, canceledBy null, checkout
                # never started. Nothing in the request or the repository can
                # cause this — the build died waiting.
                WHY='Unity did not attribute it to anyone and the checkout never started, so it was canceled while waiting for a build machine — nothing in this workflow or the repository can cause that. Check the build in the dashboard, whether the organization has build minutes left, and whether another build was created for the same build target while this one waited. If re-running reproduces it, the machine type or the build capacity of the organization is what to look at.'
              else
                WHY='Unity did not report a reason.'
              fi
              ;;
            *)
              WHY="Unity reported '${CANCELED_BY}'."
              ;;
          esac
          echo "::error ::Build ${BUILD_ID} was canceled: ${WHY}"
          exit 1
        fi

        # A failed build usually carries per-stage details; surface the first few
        # so the log says what broke without a trip to the dashboard.
        FAILURES="$(jq -r "${FIRST_ENTRY} | [(.failureDetails // [])[] | \"  - \" + ((.stage // \"?\") | tostring) + \": \" + ((.publicMessage // .label // \"\") | tostring)] | .[0:5] | join(\"\n\")" "$POLL_FILE" 2>/dev/null || true)"
        if [ -n "$FAILURES" ]; then
          echo "Reported failures:"
          echo "$FAILURES"
        fi
        echo "::error ::Build ${BUILD_ID} finished with status '${FINAL_STATUS}'."
        exit 1
